<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=2.0">
<title>暑促社区方向重点通报-分公司</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --red:#E60012; --red-bg:#fde2e4; --green:#00A651; --green-bg:#d6f0e0;
  --bg:#f4f5f7; --card:#fff; --ink:#1d2129; --ink2:#4e5969; --ink3:#86909c;
  --line:#e5e6eb; --accent:#165DFF; --warn:#FF7D00;
  --tel:#E60012;
}
html,body{background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei","微软雅黑",-apple-system,sans-serif;font-size:14px;line-height:1.5}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}

.header{position:sticky;top:0;z-index:50;background:linear-gradient(135deg,#E60012 0%,#b30010 100%);color:#fff;padding:12px 16px;box-shadow:0 2px 8px rgba(230,0,18,.25)}
.header h1{font-size:18px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:8px}
.header h1 .badge{background:rgba(255,255,255,.18);border-radius:4px;padding:2px 8px;font-size:11px;font-weight:600}
.header .sub{font-size:12px;opacity:.85;margin-top:2px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.header .sub .pipe{opacity:.5}
.mswitch{cursor:pointer;font-weight:700;color:#ffe0a0}
.mswitch .mbtn{padding:2px 10px;border-radius:4px;transition:background .2s}
.mswitch .mbtn.active{background:rgba(255,255,255,.25);color:#fff}
.mswitch .mbtn:not(.active){opacity:.7;text-decoration:underline}

.datebar{position:sticky;top:62px;z-index:40;background:#fff;border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;overflow-x:auto}
.datebar::-webkit-scrollbar{height:4px}
.datebar::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px}
.datebar .lbl{font-size:13px;color:var(--ink2);font-weight:600;flex-shrink:0}
.datebar .arrow{flex-shrink:0;background:var(--bg);border-radius:6px;padding:8px 10px;color:var(--ink2);font-size:16px}
.datebar .arrow:hover{background:var(--line);color:var(--ink)}
.datebar .arrow:disabled{opacity:.35;cursor:not-allowed}
.datebar .days{display:flex;gap:6px;flex-shrink:0}
.datebar .dchip{flex-shrink:0;min-width:32px;padding:6px 8px;border-radius:8px;background:var(--bg);color:var(--ink2);font-size:12px;text-align:center;font-weight:600;border:1px solid transparent;line-height:1.3}
.datebar .dchip .dd{display:block;font-size:11px;opacity:.7;font-weight:400;margin-top:1px}
.datebar .dchip:hover{background:var(--line)}
.datebar .dchip.active{background:var(--tel);color:#fff;border-color:var(--tel);box-shadow:0 2px 6px rgba(230,0,18,.3)}
.datebar .dchip.active .dd{opacity:.85}
.datebar .dchip.weekend:not(.active){color:#9c5b00;background:#fff4e6}

.container{max-width:1280px;margin:0 auto;padding:12px 14px 60px}

.section{margin-top:14px}
.section-title{font-size:14px;font-weight:700;color:var(--ink);margin:14px 0 8px;display:flex;align-items:center;gap:8px}
.section-title::before{content:"";width:3px;height:14px;background:var(--tel);border-radius:2px}
.section-title .meta{font-size:12px;color:var(--ink3);font-weight:400;margin-left:auto}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.card{background:var(--card);border-radius:12px;padding:12px 14px;box-shadow:0 1px 4px rgba(0,0,0,.04);position:relative;overflow:hidden;border-top:3px solid transparent}
.card.zhiping{border-top-color:#722ED1}
.card.fttr{border-top-color:#13C2C2}
.card.jiakuan{border-top-color:#165DFF}
.card.qianzhao{border-top-color:#FA8C16}
.card .top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.card .name{font-size:15px;font-weight:700;color:var(--ink)}
.card .name .sub{font-size:11px;color:var(--ink3);font-weight:400;margin-left:4px}
.card .rate{font-size:24px;font-weight:700;font-family:"DIN Alternate","Arial",sans-serif;line-height:1;letter-spacing:-1px}
.card .rate.up{color:var(--red)}
.card .rate.down{color:var(--green)}
.card .rate.warn{color:var(--warn)}
.card .rate .pct{font-size:14px;font-weight:600;margin-left:1px;opacity:.85}
.card .grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.card .stat{background:var(--bg);padding:5px 8px;border-radius:6px}
.card .stat .k{font-size:10px;color:var(--ink3);line-height:1.2}
.card .stat .v{font-size:13px;font-weight:700;color:var(--ink);line-height:1.2;font-family:"DIN Alternate","Arial",sans-serif;margin-top:2px}
.card .stat .mom{font-size:10px;font-weight:700;margin-left:4px;font-family:"DIN Alternate","Arial",sans-serif;vertical-align:middle}
.card .stat .mom.up{color:var(--red)}
.card .stat .mom.down{color:var(--green)}
.card .target-bar{margin-top:8px;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;position:relative}
.card .target-bar .fill{height:100%;background:linear-gradient(90deg,#722ED1,#E60012);transition:width .4s ease;border-radius:3px}
.card .target-bar .mark{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5;transform:translateX(-1px);left:100%}
.card .target-bar .mark::after{content:"目标";position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-size:9px;color:var(--ink3);white-space:nowrap}

.zone-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.zone-card{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);border-left:3px solid var(--accent)}
.zone-card.city{border-left-color:#722ED1}
.zone-card.sub{border-left-color:#13C2C2}
.zone-card.far{border-left-color:#FA8C16}
.zone-card .zt{font-size:13px;font-weight:700;display:flex;justify-content:space-between;align-items:center;color:var(--ink)}
.zone-card .zt .avg{font-weight:600;color:var(--ink2);font-size:12px}
.zone-card .rankpair{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.rankbox{padding:6px 8px;border-radius:6px}
.rankbox.first{background:var(--red-bg)}
.rankbox.last{background:var(--green-bg)}
.rankbox .tag{font-size:10px;font-weight:700;display:flex;align-items:center;gap:3px}
.rankbox.first .tag{color:var(--red)}
.rankbox.last .tag{color:var(--green)}
.rankbox .nm{font-size:13px;font-weight:700;margin-top:1px}
.rankbox .v{font-size:11px;color:var(--ink2);margin-top:1px;font-family:"DIN Alternate","Arial",sans-serif}

.chart-box{background:var(--card);border-radius:12px;padding:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.chart-tabs{display:flex;gap:6px;margin-bottom:10px;border-bottom:1px solid var(--line);overflow-x:auto}
.chart-tab{padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink3);border-bottom:2px solid transparent;white-space:nowrap}
.chart-tab.active{color:var(--tel);border-bottom-color:var(--tel)}
.chart-area{height:280px;position:relative}
.chart-area canvas{max-height:280px}
.trend-tip{font-size:11px;color:var(--ink3);margin-top:6px}

.rank-table{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.04);overflow-x:auto}
.rank-table .row{display:grid;grid-template-columns:40px 1fr 90px 1fr 1fr 1fr 1fr 70px 70px 70px 70px 70px;gap:5px;padding:9px 10px;align-items:center;border-bottom:1px solid var(--line);min-width:1100px}
.rank-table .row.head{background:#f7f8fa;font-size:11px;color:var(--ink3);font-weight:600;padding:8px 12px}
.rank-table .row.head .col{text-align:right;cursor:pointer;user-select:none;white-space:nowrap}
.rank-table .row.head .col:hover{color:var(--tel)}
.rank-table .row.head .col.l,.rank-table .row.head .col.c{text-align:center}
.rank-table .row.head .col.cl{text-align:left}
.rank-table .row.head .col .arrow{font-size:9px;color:var(--ink3);margin-left:1px}
.rank-table .row.head .col.sorted .arrow{color:var(--tel)}
.rank-table .row.zg-header{background:linear-gradient(90deg,#fff5f6,#fff);font-size:12px;font-weight:700;color:var(--ink2);padding:8px 12px;display:flex;align-items:center;gap:8px}
.rank-table .row.zg-header .zg-dot{width:8px;height:8px;border-radius:2px;display:inline-block}
.rank-table .row.zg-header .zg-meta{margin-left:auto;color:var(--ink3);font-size:11px;font-weight:400}
.rank-table .row:last-child{border-bottom:none}
.rank-table .row:hover{background:#fafbfc}
.rank-table .rk{font-weight:700;color:var(--ink3);font-size:13px;text-align:center;font-family:"DIN Alternate","Arial",sans-serif}
.rank-table .rk.top1{color:var(--red);font-size:15px}
.rank-table .rk.top2{color:#FF7D00}
.rank-table .rk.top3{color:#FFB400}
.rank-table .rk.last{color:var(--green);font-size:15px}
.rank-table .bn{font-weight:700;color:var(--ink);display:flex;flex-direction:column;gap:1px}
.rank-table .bn .zg{font-size:10px;color:var(--ink3);font-weight:400}
.rank-table .zn{font-size:11px;color:var(--ink2);font-weight:600;background:var(--bg);text-align:center;padding:2px 6px;border-radius:4px;width:fit-content}
.rank-table .zn.city{color:#722ED1;background:#f3ecff}
.rank-table .zn.sub{color:#0c7575;background:#e0faf7}
.rank-table .zn.far{color:#a85b00;background:#fff1e0}
.rank-table .avg-col{text-align:right;font-family:"DIN Alternate","Arial",sans-serif}
.rank-table .avg-col .val{font-size:13px;font-weight:700}
.rank-table .avg-col .ll{font-size:9px;color:var(--ink3);line-height:1}
.rank-table .avg-col .val.up{color:var(--red)}
.rank-table .avg-col .val.down{color:var(--green)}
.rank-table .metric{text-align:right;font-family:"DIN Alternate","Arial",sans-serif}
.rank-table .metric .val{font-size:13px;font-weight:700}
.rank-table .metric .ll{font-size:10px;color:var(--ink3);line-height:1}
.rank-table .metric .val.up{color:var(--red)}
.rank-table .metric .val.down{color:var(--green)}
.rank-table .metric .val.warn{color:var(--warn)}
.rate-pill{display:inline-block;padding:2px 7px;border-radius:10px;font-size:12px;font-weight:700;font-family:"DIN Alternate","Arial",sans-serif}
.rate-pill.up{background:var(--red-bg);color:var(--red)}
.rate-pill.down{background:var(--green-bg);color:var(--green)}
.rate-pill.warn{background:#fff4e6;color:var(--warn)}
.bar-mini{height:4px;background:var(--bg);border-radius:2px;margin-top:2px;overflow:hidden}
.bar-mini .pf{height:100%;border-radius:2px;background:var(--red)}
.bar-mini .pf.down{background:var(--green)}
.bar-mini .pf.warn{background:var(--warn)}

.rank-table .momtag{font-size:9px;font-weight:700;font-family:"DIN Alternate","Arial",sans-serif;padding:0 2px;border-radius:3px;display:inline-block;margin-left:2px;vertical-align:middle}
.rank-table .momtag.up{color:var(--red);background:var(--red-bg)}
.rank-table .momtag.down{color:var(--green);background:var(--green-bg)}

.rank-filter{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px;padding:8px 12px;background:var(--card);border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.rank-filter .grp{display:flex;gap:4px;align-items:center}
.rank-filter .gl{font-size:12px;color:var(--ink3);font-weight:600;margin-right:2px}
.rank-filter .chip{padding:5px 12px;border-radius:14px;background:var(--bg);color:var(--ink2);font-size:12px;font-weight:600;border:1px solid transparent;white-space:nowrap}
.rank-filter .chip:hover{background:var(--line)}
.rank-filter .chip.active{background:var(--tel);color:#fff;border-color:var(--tel);box-shadow:0 1px 4px rgba(230,0,18,.3)}
.rank-filter .sep{width:1px;height:18px;background:var(--line);margin:0 4px}
.rank-filter select{padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-family:inherit;min-width:110px;cursor:pointer;outline:none}
.rank-filter select:focus{border-color:var(--accent)}

.insights{background:linear-gradient(180deg,#fff,#fafbfc);border-radius:10px;padding:12px 14px;border-left:3px solid var(--tel);font-size:13px;color:var(--ink);line-height:1.7}
.insights .hd{font-weight:700;color:var(--tel);font-size:13px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.insights ul{padding-left:18px;margin-top:4px}
.insights li{margin-top:3px}
.insights .neg{color:var(--green);font-weight:700}
.insights .pos{color:var(--red);font-weight:700}

.footer{text-align:center;color:var(--ink3);font-size:11px;padding:20px 14px 30px}
.footer .pipe{margin:0 5px;opacity:.5}

@media(max-width:720px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .zone-row{grid-template-columns:1fr;gap:8px}
  .header h1{font-size:16px}
  .card .rate{font-size:20px}
  .container{padding:8px 10px 60px}
  .chart-area{height:240px}
}

.mask{position:fixed;inset:0;background:rgba(255,255,255,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:200;color:var(--ink3)}
.mask .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--tel);border-radius:50%;animation:rot 1s linear infinite;margin-bottom:10px}
@keyframes rot{to{transform:rotate(360deg)}}

/* ===== 分公司下钻视图 ===== */
.branch-drill{display:none}
body.drilling .branch-drill{display:block}
body.drilling .main-view{display:none}
.drill-header{display:flex;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.drill-back{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:7px 14px;font-size:13px;font-weight:600;color:var(--ink2);box-shadow:0 1px 4px rgba(0,0,0,.04);transition:all .2s}
.drill-back:hover{color:var(--tel);border-color:var(--tel)}
.drill-back .arr{font-size:16px;line-height:1}
.drill-title-name{font-size:20px;font-weight:800;color:var(--ink);display:flex;align-items:center;gap:8px}
.drill-title-name .zchip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:10px}
.drill-title-name .zchip.city{color:#722ED1;background:#f3ecff}
.drill-title-name .zchip.sub{color:#0c7575;background:#e0faf7}
.drill-title-name .zchip.far{color:#a85b00;background:#fff1e0}
.drill-title-meta{margin-left:auto;font-size:12px;color:var(--ink3);font-weight:400}
.drill-zone-rank{display:flex;flex-direction:column;gap:8px}
.drill-zone-row{background:var(--card);border-radius:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.04);display:flex;align-items:center;gap:10px;border-left:3px solid var(--line);cursor:pointer;transition:all .2s}
.drill-zone-row:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.drill-zone-row.self{border-left-color:var(--tel);background:linear-gradient(90deg,#fff5f6,#fff)}
.drill-zone-row .zr-rank{width:28px;height:28px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;color:var(--ink2);flex-shrink:0;font-family:"DIN Alternate","Arial",sans-serif}
.drill-zone-row.self .zr-rank{background:var(--tel);color:#fff}
.drill-zone-row .zr-name{font-size:15px;font-weight:700;flex:0 0 90px}
.drill-zone-row .zr-rate{flex:1;display:flex;align-items:center;gap:8px}
.drill-zone-row .zr-bar{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.drill-zone-row .zr-bar .pf{height:100%;border-radius:4px;background:var(--red)}
.drill-zone-row .zr-bar .pf.down{background:var(--green)}
.drill-zone-row .zr-bar .pf.warn{background:var(--warn)}
.drill-zone-row .zr-pill{flex-shrink:0;min-width:78px;text-align:right;font-family:"DIN Alternate","Arial",sans-serif}
.drill-zone-row .zr-pill .val{font-size:16px;font-weight:800}
.drill-zone-row .zr-pill .sub{font-size:10px;color:var(--ink3)}
.drill-zone-row.self .zr-pill .val{color:var(--tel)}
.drill-cards .cards{grid-template-columns:repeat(4,1fr)}
@media(max-width:720px){
  .drill-cards .cards{grid-template-columns:repeat(2,1fr)}
  .drill-title-name{font-size:17px}
  .drill-zone-row{flex-wrap:wrap}
  .drill-zone-row .zr-name{flex-basis:100%}
}
</style>
</head>
<body>

<div class="header">
  <h1>暑促社区方向重点通报-分公司 <span class="badge" id="monthBadge">7月</span></h1>
  <div class="sub">
    <span>智屏·FTTR·家宽·千兆 四指标联动</span>
    <span class="pipe">|</span>
    <span>15家分公司 / 3大战区</span>
    <span class="pipe">|</span>
    <span>红涨绿跌</span>
    <span class="pipe">|</span>
    <span class="mswitch" id="monthSwitch"></span>
  </div>
</div>

<div class="datebar">
  <button class="arrow" id="prevDay" title="前一天">&#8249;</button>
  <button class="arrow" id="nextDay" title="后一天">&#8250;</button>
  <span class="lbl">日期：</span>
  <div class="days" id="daysList"></div>
</div>

<div class="container main-view">

  <div class="section">
    <div class="section-title">总体概览<span class="meta" id="dateMeta"></span></div>
    <div class="cards" id="cards"></div>
  </div>

  <div class="section">
    <div class="section-title">战区 · 第一/倒数<span class="meta">按家宽完成率排名</span></div>
    <div class="zone-row" id="zoneRow"></div>
  </div>

  <div class="section">
    <div class="section-title">当日新增 · 31日趋势<span class="meta">点击切换指标 · 悬停查看日均/完成率</span></div>
    <div class="chart-box">
      <div class="chart-tabs" id="chartTabs">
        <button class="chart-tab active" data-key="jiakuan">家宽</button>
        <button class="chart-tab" data-key="fttr">FTTR</button>
        <button class="chart-tab" data-key="zhiping">智屏</button>
        <button class="chart-tab" data-key="qianzhao">千兆</button>
      </div>
      <div class="chart-area"><canvas id="trendChart"></canvas></div>
      <div class="trend-tip" id="trendTip"></div>
    </div>
  </div>

  <div class="section">
    <div class="section-title">分公司排名 · 4指标完成率<span class="meta" id="rankMeta"></span></div>
    <div class="rank-filter" id="rankFilter"></div>
    <div class="rank-table" id="rankTable"></div>
  </div>

  <div class="section">
    <div class="section-title">当日要点解读</div>
    <div class="insights" id="insights"></div>
  </div>

</div>

<!-- ===== 分公司下钻视图 ===== -->
<div class="container branch-drill" id="drillView">
  <div class="drill-header">
    <button class="drill-back" id="drillBack"><span class="arr">&#8592;</span> 返回总览</button>
    <div class="drill-title-name" id="drillTitle"></div>
    <div class="drill-title-meta" id="drillMeta"></div>
  </div>

  <div class="section">
    <div class="section-title">总体概览<span class="meta">4指标 完成率/当日/累计/日均</span></div>
    <div class="drill-cards"><div class="cards" id="drillCards"></div></div>
  </div>

  <div class="section">
    <div class="section-title">所在战区排名<span class="meta" id="drillZoneMeta"></span></div>
    <div class="drill-zone-rank" id="drillZoneRank"></div>
  </div>

  <div class="section">
    <div class="section-title">日趋势 · 4指标<span class="meta">当日新增曲线</span></div>
    <div class="chart-box">
      <div class="chart-tabs" id="drillChartTabs">
        <button class="chart-tab active" data-key="jiakuan">家宽</button>
        <button class="chart-tab" data-key="fttr">FTTR</button>
        <button class="chart-tab" data-key="zhiping">智屏</button>
        <button class="chart-tab" data-key="qianzhao">千兆</button>
      </div>
      <div class="chart-area"><canvas id="drillTrendChart"></canvas></div>
      <div class="trend-tip" id="drillTrendTip"></div>
    </div>
  </div>
</div>

<div class="footer">
  数据来源：智光数据 / 宽带发展数据 底表<span class="pipe">|</span>口径：智屏/FTTR按归档时间、家宽/千兆按入网时间<span class="pipe">|</span>加载率=FTTR新增/千兆新增
</div>

}

function renderMonthSwitch(){
  var el = document.getElementById('monthSwitch');
  var months = Object.keys(MULTI.months).sort();
  var html = '切换：';
  months.forEach(function(m, i){
    if(i > 0) html += ' ';
    if(m === curMonth){
      html += '<span class="mbtn active">' + m + '月</span>';
    } else {
      html += '<span class="mbtn" onclick="switchMonth(\'' + m + '\')">' + m + '月</span>';

  });

}

function fmt(n,d){
  if(n===null||n===undefined||isNaN(n))return '-';
  d=(d===undefined?1:d);
  if(Math.abs(n)>=1000&&d>0) return n.toFixed(0);
  return Number(n).toFixed(d);
}
function fmtInt(n){return (n===null||n===undefined||isNaN(n))?'-':Math.round(n).toString()}
function weekdayLabel(dateStr){
  var d=new Date(dateStr.slice(0,4)+'-'+dateStr.slice(4,6)+'-'+dateStr.slice(6,8));
  var w=d.getDay();var wd=['日','一','二','三','四','五','六'][w];
  return '周'+wd;
}
function isWeekend(dateStr){
  var d=new Date(dateStr.slice(0,4)+'-'+dateStr.slice(4,6)+'-'+dateStr.slice(6,8));
  return d.getDay()===0||d.getDay()===6;
}
function rateClass(r,base){base=base||100;if(r>=base)return 'up';if(r>=base*0.8)return 'warn';return 'down'}

}

// ===== Trend chart =====
function renderTrend(){
  var d=REPORT.days[curIdx];
  var labels=REPORT.days.map(function(x){return curMonth+'/'+x.day});
  var m=metricMeta[curTab];
  var JD=REPORT.meta.june_daily||[];

  // 7月当日新增数组
  var dailyArr=REPORT.days.map(function(x){
    if(curTab==='qianzhao') return x.overall.qianzhao.daily||0;
    return x.overall[curTab].daily||0;
  });

  // 6月每日新增
  var juneDailyArr=REPORT.days.map(function(x,i){
    if(i>=JD.length)return null;
    var jd=JD[i];
    if(!jd)return null;
    if(i===0){
      if(curTab==='qianzhao') return jd.qianzhao_avg||0;
      return jd[curTab+'_avg']||0;
    }
    var prev=JD[i-1];
    if(!prev)return null;
    if(curTab==='qianzhao') return jd.qianzhao_avg||0;
    var curAvg=jd[curTab+'_avg']||0;
    var prevAvg=prev[curTab+'_avg']||0;
    return Math.round(curAvg*(i+1) - prevAvg*i);
  });

  document.getElementById('trendTip').innerHTML='<strong style="color:'+m.color+'">━━ '+curMonth+'月当日新增</strong> vs <strong style="color:#86909c">- - '+prevMonth+'当日新增</strong>，红色虚线为牵引值(日均目标)，红点标记当前所选日期，<span style="color:#FA8C16">橙色点为周末</span>';

  var targetLine=(curTab==='qianzhao')?32:(m.target_total||0);

  var ctx=document.getElementById('trendChart').getContext('2d');
  if(trendChart)trendChart.destroy();
  trendChart=new Chart(ctx,{
    type:'line',
    data:{labels:labels,datasets:[
      {
        label:curMonth+'月 '+m.name+'当日新增',
        data:dailyArr,
        borderColor:m.color,
        backgroundColor:m.color+'15',
        borderWidth:2.5,
        tension:0.3,
        pointRadius:function(ctx){
          if(ctx.dataIndex===curIdx)return 7;
          return isWeekend(REPORT.days[ctx.dataIndex].date)?3:2;
        },
        pointBackgroundColor:function(ctx){
          if(ctx.dataIndex===curIdx)return '#E60012';
          return isWeekend(REPORT.days[ctx.dataIndex].date)?'#FA8C16':m.color;
        },
        pointBorderColor:'#fff',
        pointBorderWidth:1,
        fill:true,
        order:1
      },
      {
        label:prevMonth+' '+m.name+'当日新增',
        data:juneDailyArr,
        borderColor:'#86909c',
        backgroundColor:'transparent',
        borderWidth:1.8,
        borderDash:[6,4],
        tension:0.3,
        pointRadius:0,
        pointHoverRadius:4,
        pointBackgroundColor:'#86909c',
        fill:false,
        order:2
      },
      {
        label:(curTab==='qianzhao'?'千兆占比目标(32%)':m.name+'牵引值(日均)'),
        data:labels.map(function(){return targetLine}),
        borderColor:'#E60012',
        borderDash:[4,4],
        borderWidth:2,
        pointRadius:0,
        fill:false,
        order:3
      }
    ]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{font:{size:11},boxWidth:14,boxHeight:8,padding:8}},
        tooltip:{
          callbacks:{
            title:function(items){
              if(!items||!items.length)return '';
              var idx=items[0].dataIndex;
              var dayObj=REPORT.days[idx];
              var wd=weekdayLabel(dayObj.date);
              var we=isWeekend(dayObj.date);
              return curMonth+'/'+dayObj.day+'('+wd+')'+(we?' ⏶ 周末':'');
            },
            label:function(ctx){
              var dIdx=ctx.dataIndex;
              var dayObj=REPORT.days[dIdx];
              if(ctx.datasetIndex===0){
                if(curTab==='qianzhao'){
                  return curMonth+'月千兆新增 '+fmtInt(ctx.parsed.y)+'户 | 日均 '+fmt(dayObj.overall.qianzhao.avg,1)+' | 占比 '+fmt(dayObj.overall.qianzhao.avg/dayObj.overall.jiakuan.avg*100,1)+'%';
                }
                var mObj=dayObj.overall[curTab];
                return curMonth+'月'+m.name+'新增 '+fmtInt(ctx.parsed.y)+'户 | 日均 '+fmt(mObj.avg,1)+'户 | 完成率 '+fmt(mObj.rate,1)+'%';
              }
              if(ctx.datasetIndex===1){
                var jd=JD[dIdx];
                if(!jd)return prevMonth+': 无数据';
                if(curTab==='qianzhao'){
                  return prevMonth+'千兆日均 '+fmt(jd.qianzhao_avg,1)+' | 占比 '+fmt(jd.qianzhao_ratio,1)+'%';
                }
                var jv=jd[curTab+'_avg']||0;
                var curVal=dayObj.overall[curTab].avg||0;
                var mom=jv?((curVal-jv)/jv*100):0;
                var momStr=mom>=0?'+':'';
                return prevMonth+m.name+'新增 '+fmtInt(ctx.parsed.y)+'户 | 日均 '+fmt(jv,1)+'户 | 环比'+prevMonth+' '+momStr+fmt(mom,1)+'%';
              }
              return ctx.dataset.label+': '+fmt(ctx.parsed.y,1);
            }
          }
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},maxRotation:0,autoSkip:false,color:function(ctx){
          var idx=ctx.index;
          if(idx>=0&&idx<REPORT.days.length&&isWeekend(REPORT.days[idx].date))return '#9c5b00';
          return '#4e5969';
        }}},
        y:{beginAtZero:true,grid:{color:'#f0f1f3'}}
      }
    }
  });
}

// ===== Branch rank table =====
function buildBranchRow(b,i,isLast){
  var rkcls='';
  if(i===0)rkcls='top1';else if(i===1)rkcls='top2';else if(i===2)rkcls='top3';
  if(i===isLast)rkcls='last';
  var jkCls=rateClass(b.jiakuan.rate);
  var zoneCls={'市区':'city','近郊':'sub','远郊':'far'};
  var JA=REPORT.meta.june_avg||{};
  var jBraw=((JA.branch||{})[b.branch])||{};
  var jB={jiakuan:jBraw.jiakuan_avg,fttr:jBraw.fttr_avg,zhiping:jBraw.zhiping_avg,qianzhao:jBraw.qianzhao_avg};
  function bar(rate){
    var cls=rateClass(rate);
    var w=Math.min(150,rate);
    return '<div class="bar-mini"><div class="pf '+cls+'" style="width:'+w+'%"></div></div>';
  }
  function momMini(curAvg,juneVal){
    if(!juneVal||juneVal<=0||!curAvg)return '';
    var v=(curAvg-juneVal)/juneVal*100;
    var cls=v>=0?'up':'down';
    return ' <span class="momtag '+cls+'">'+(v>=0?'+':'')+fmt(v,1)+'%</span>';
  }
  function metricCell(rate,avg,juneVal){
    return '<div class="metric"><span class="rate-pill '+rateClass(rate)+'">'+fmt(rate,1)+'%</span>'+
           '<div class="ll" style="margin-top:2px">日均 '+fmt(avg,1)+momMini(avg,juneVal)+'</div>'+bar(rate)+'</div>';
  }
  function cunliangCell(rate,avg,juneVal,cunliangAvg){
    var cl='';if(cunliangAvg&&cunliangAvg>0)cl='<div class="ll" style="margin-top:0px;color:#86909c;font-size:10px">存量加载 '+fmt(cunliangAvg,1)+'</div>';
    return '<div class="metric"><span class="rate-pill '+rateClass(rate)+'">'+fmt(rate,1)+'%</span>'+
           '<div class="ll" style="margin-top:2px">日均 '+fmt(avg,1)+momMini(avg,juneVal)+'</div>'+cl+bar(rate)+'</div>';
  }
  function avgCell(val,juneVal){
    if(!val&&val!==0)return '<div class="avg-col"><div class="val">-</div></div>';
    var cls='';
    if(juneVal&&juneVal>0&&val){
      var v=(val-juneVal)/juneVal*100;
      cls=v>=0?'up':'down';
    }
    return '<div class="avg-col"><div class="val '+cls+'">'+fmt(val,1)+'</div></div>';
  }
  var qzCls=b.qianzhao.qz_ratio>=32?'up':(b.qianzhao.qz_ratio>=25?'warn':'down');
  var qzCell='<div class="metric"><span class="rate-pill '+qzCls+'">'+fmt(b.qianzhao.qz_ratio,1)+'%</span>'+
             '<div class="ll" style="margin-top:2px">日均 '+fmt(b.qianzhao.avg,1)+momMini(b.qianzhao.avg,jB.qianzhao)+'</div></div>';
  return '<div class="row">'
    +'<div class="rk '+rkcls+'">'+(i+1)+'</div>'
    +'<div class="bn"><div class="branch-link" data-branch="'+b.branch+'" style="cursor:pointer">'+b.branch+'<span style="font-size:10px;color:var(--tel);margin-left:2px">&#10148;</span></div><div class="zn '+zoneCls[b.zone]+'">'+b.zone+'</div></div>'
    +'<div class="metric" style="text-align:left;padding-left:4px"><div class="val '+jkCls+'" style="text-align:left">'+b.jiakuan.cum+'户</div><div class="ll">家宽月累计</div></div>'
    +metricCell(b.jiakuan.rate,b.jiakuan.avg,jB.jiakuan)
    +cunliangCell(b.fttr.rate,b.fttr.avg,jB.fttr,b.fttr.cunliang_avg)
    +cunliangCell(b.zhiping.rate,b.zhiping.avg,jB.zhiping,b.zhiping.cunliang_avg)
    +qzCell
    +avgCell(b.jiakuan.avg,jB.jiakuan)
    +avgCell(b.fttr.avg,jB.fttr)
    +avgCell(b.zhiping.avg,jB.zhiping)
    +avgCell(b.jiakuan.ronghe_avg,0)
    +avgCell(b.qianzhao.avg,jB.qianzhao)
    +'</div>';
}

// 排序状态
var rankSortKey=null; // null=默认(家宽完成率降序), {key:'xxx', dir:'desc'|'asc'}
var RANK_SORT_KEYS={
  'jk_cum':'jiakuan.cum','jk_rate':'jiakuan.rate','fttr_rate':'fttr.rate',
  'zp_rate':'zhiping.rate','qz_ratio':'qianzhao.qz_ratio',
  'jk_avg':'jiakuan.avg','fttr_avg':'fttr.avg','zp_avg':'zhiping.avg',
  'rh_avg':'jiakuan.ronghe_avg','qz_avg':'qianzhao.avg'
};
function getRankSortVal(b,key){
  var map=RANK_SORT_KEYS[key];if(!map)return 0;
  var parts=map.split('.');var v=b;
  for(var i=0;i<parts.length;i++){v=(v||{})[parts[i]];}
  return v||0;
}
function renderRank(){
  var d=REPORT.days[curIdx];
  renderRankFilter();
  var arr=d.branch.slice().filter(function(b){
    if(curBranch!=='all')return b.branch===curBranch;
    if(curZone!=='all')return b.zone===curZone;
    return true;
  });
  // 排序
  if(rankSortKey){
    var key=rankSortKey.key,dir=rankSortKey.dir==='asc'?1:-1;
    arr.sort(function(a,b){return(getRankSortVal(a,key)-getRankSortVal(b,key))*dir});
  }else{
    arr.sort(function(a,b){return(b.jiakuan.rate||0)-(a.jiakuan.rate||0)});
  }
  var sortLabel=rankSortKey?('按'+rankSortLabel(rankSortKey.key)+(rankSortKey.dir==='asc'?'升序':'降序') ):('按家宽完成率降序');
  document.getElementById('rankMeta').textContent='共 '+arr.length+' 家分公司, '+sortLabel;
  document.getElementById('rankFilterHint').textContent='';
  var arrow=function(key){
    if(rankSortKey&&rankSortKey.key===key)return '<span class="arrow">'+(rankSortKey.dir==='desc'?'▼':'▲')+'</span>';
    return '<span class="arrow">↕</span>';
  };
  var colCls=function(key){return rankSortKey&&rankSortKey.key===key?' sorted':'';};
  var headRow='<div class="row head">'
    +'<div class="col c">序</div><div class="col cl">分公司</div>'
    +'<div class="col cl" style="cursor:default">家宽累计</div>'
    +'<div class="col" data-sort="jk_rate">家宽完成率'+arrow('jk_rate')+'</div>'
    +'<div class="col" data-sort="fttr_rate">FTTR完成率'+arrow('fttr_rate')+'</div>'
    +'<div class="col" data-sort="zp_rate">智屏完成率'+arrow('zp_rate')+'</div>'
    +'<div class="col" data-sort="qz_ratio">千兆占比'+arrow('qz_ratio')+'</div>'
    +'<div class="col'+colCls('jk_avg')+'" data-sort="jk_avg">家宽日均'+arrow('jk_avg')+'</div>'
    +'<div class="col'+colCls('fttr_avg')+'" data-sort="fttr_avg">FTTR日均'+arrow('fttr_avg')+'</div>'
    +'<div class="col'+colCls('zp_avg')+'" data-sort="zp_avg">智屏日均'+arrow('zp_avg')+'</div>'
    +'<div class="col'+colCls('rh_avg')+'" data-sort="rh_avg">融合日均'+arrow('rh_avg')+'</div>'
    +'<div class="col'+colCls('qz_avg')+'" data-sort="qz_avg">千兆日均'+arrow('qz_avg')+'</div></div>';
  var rows='';
  if(curGroup==='zone'&&(curZone==='all'&&curBranch==='all')){
    var ZORDER=[['市区','#722ED1'],['近郊','#13C2C2'],['远郊','#FA8C16']];
    ZORDER.forEach(function(zcol){
      var zn=zcol[0], dotColor=zcol[1];
      var zb=arr.filter(function(b){return b.zone===zn});
      var zcum=0,zzcum=0;
      zb.forEach(function(b){zcum+=b.jiakuan.cum;zzcum+=b.fttr.cum});
      rows+='<div class="row zg-header"><span class="zg-dot" style="background:'+dotColor+'"></span>'+zn+'分公司排名<small style="font-weight:400;color:var(--ink3);margin-left:6px">('+zb.length+'家)</small><span class="zg-meta">家宽月累计合计 '+fmtInt(zcum)+'户 · FTTR月累计合计 '+fmtInt(zzcum)+'户</span></div>';
      zb.forEach(function(b,i){rows+=buildBranchRow(b,i,zb.length-1)});
    });
  }else{
    arr.forEach(function(b,i){rows+=buildBranchRow(b,i,arr.length-1)});
  }
  var el=document.getElementById('rankTable');
  el.innerHTML=headRow+rows;
  // 绑定表头排序事件
  el.querySelectorAll('.row.head .col[data-sort]').forEach(function(col){
    col.onclick=function(){
      var key=col.dataset.sort;
      if(rankSortKey&&rankSortKey.key===key){
        rankSortKey.dir=rankSortKey.dir==='desc'?'asc':'desc';
      }else{
        rankSortKey={key:key,dir:'desc'};
      }
      renderRank();
    };
  });
  // 绑定分公司下钻点击事件
  el.querySelectorAll('.branch-link').forEach(function(link){
    link.onclick=function(ev){
      ev.stopPropagation();
      openDrill(link.dataset.branch);
    };
  });
}
function rankSortLabel(key){
  var m={jk_rate:'家宽完成率',fttr_rate:'FTTR完成率',zp_rate:'智屏完成率',qz_ratio:'千兆占比',
    jk_avg:'家宽日均',fttr_avg:'FTTR日均',zp_avg:'智屏日均',rh_avg:'融合日均',qz_avg:'千兆日均'};
  return m[key]||key;
}

// ===== Insights =====
function renderInsights(){
  var d=REPORT.days[curIdx];
  var O=d.overall;
  var zprate=O.zhiping.rate,ftrate=O.fttr.rate,jkrate=O.jiakuan.rate;
  var qz_ratio=O.jiakuan.avg?(O.qianzhao.avg/O.jiakuan.avg*100):0;

  var JA=REPORT.meta.june_avg||{};
  var JO=JA.overall||{};
  var june_zp=JO.zhiping_avg||0, june_ft=JO.fttr_avg||0, june_jk=JO.jiakuan_avg||0, june_qz=JO.qianzhao_avg||0;
  var mom_zp=june_zp?((O.zhiping.avg-june_zp)/june_zp*100):0;
  var mom_ft=june_ft?((O.fttr.avg-june_ft)/june_ft*100):0;
  var mom_jk=june_jk?((O.jiakuan.avg-june_jk)/june_jk*100):0;
  var mom_qz=june_qz?((O.qianzhao.avg-june_qz)/june_qz*100):0;

  function colorTag(v){var c=v>=0?'pos':'neg';var s=v>=0?'↑ +':'↓ ';return '<span class="'+c+'">'+s+fmt(Math.abs(v),1)+'%</span>'}

  var arr=d.branch.slice().sort(function(a,b){return(b.jiakuan.rate||0)-(a.jiakuan.rate||0)});
  var first=arr[0],last=arr[arr.length-1];
  var arrZp=d.branch.slice().sort(function(a,b){return(b.zhiping.rate||0)-(a.zhiping.rate||0)});
  var firstZp=arrZp[0],lastZp=arrZp[arrZp.length-1];
  var arrFt=d.branch.slice().sort(function(a,b){return(b.fttr.rate||0)-(a.fttr.rate||0)});
  var firstFt=arrFt[0],lastFt=arrFt[arrFt.length-1];

  var html='<div class="hd">截至 '+curMonth+'/'+d.day+'（已过'+d.days_elapsed+'天）核心结论：</div><ul>';
  html+='<li>公司整体 <strong>家宽</strong> 月度日均 <strong>'+fmt(O.jiakuan.avg,1)+'</strong> 户/日（'+prevMonth+'同期 '+fmt(june_jk,1)+'），完成率 <span class="'+(jkrate>=100?'pos':'neg')+'">'+fmt(jkrate,1)+'%</span>，较'+prevMonth+'日均 '+colorTag(mom_jk)+'；<strong>FTTR</strong> 月度日均 <strong>'+fmt(O.fttr.avg,1)+'</strong> 户/日（'+prevMonth+'同期 '+fmt(june_ft,1)+'），完成率 <span class="'+(ftrate>=100?'pos':'neg')+'">'+fmt(ftrate,1)+'%</span>，较'+prevMonth+'日均 '+colorTag(mom_ft)+'。</li>';
  html+='<li><strong>智屏</strong> 月度日均 <strong>'+fmt(O.zhiping.avg,1)+'</strong> 户/日（'+prevMonth+'同期 '+fmt(june_zp,1)+'），完成率 <span class="'+(zprate>=100?'pos':'neg')+'">'+fmt(zprate,1)+'%</span>，较'+prevMonth+'日均 '+colorTag(mom_zp)+'；<strong>千兆</strong> 月度日均 <strong>'+fmt(O.qianzhao.avg,1)+'</strong> 户/日（'+prevMonth+'同期 '+fmt(june_qz,1)+'），千兆占比 <span class="'+(qz_ratio>=32?'pos':'neg')+'">'+fmt(qz_ratio,1)+'</span>%，较'+prevMonth+'日均 '+colorTag(mom_qz)+'。</li>';
  html+='<li>家宽第一 <span class="pos">'+first.branch+'</span>（'+fmt(first.jiakuan.rate,1)+'%），暂落后 <span class="neg">'+last.branch+'</span>（'+fmt(last.jiakuan.rate,1)+'%）；智屏第一 <span class="pos">'+firstZp.branch+'</span>（'+fmt(firstZp.zhiping.rate,1)+'%）/ 暂落后 <span class="neg">'+lastZp.branch+'</span>（'+fmt(lastZp.zhiping.rate,1)+'%）；FTTR第一 <span class="pos">'+firstFt.branch+'</span>（'+fmt(firstFt.fttr.rate,1)+'%）/ 暂落后 <span class="neg">'+lastFt.branch+'</span>（'+fmt(lastFt.fttr.rate,1)+'%）。</li>';
  var avg_load = O.fttr.avg && O.qianzhao.avg ? O.fttr.avg/O.qianzhao.avg*100 : 0;
  html+='<li>公司整体 FTTR新增加载率 <span class="'+(avg_load>=50?'pos':'neg')+'">'+fmt(avg_load,1)+'</span>%（FTTR日均/千兆日均），反映FTTR在千兆客户中的渗透水平。</li>';
  html+='</ul>';
  document.getElementById('insights').innerHTML=html;
}

// ===== 分公司下钻 =====
var drillBranch = null;   // 当前下钻的分公司名
var drillChart = null;    // 下钻趋势图
var drillTab = 'jiakuan'; // 下钻趋势图当前指标

var BZONE_MAP={'朝阳':'市区','海淀':'市区','东城':'市区','丰台':'市区','西城':'市区','通州':'市区','昌平':'近郊','顺义':'近郊','大兴':'近郊','房山':'近郊','门头沟':'近郊','怀柔':'远郊','平谷':'远郊','延庆':'远郊','密云':'远郊'};
var ZONE_BRANCHES={'市区':['朝阳','海淀','东城','丰台','西城','通州'],'近郊':['昌平','顺义','大兴','房山','门头沟'],'远郊':['怀柔','平谷','延庆','密云']};

function openDrill(branch){
  drillBranch=branch;
  document.body.classList.add('drilling');
  renderDrill();
  window.scrollTo(0,0);
}
function closeDrill(){
  drillBranch=null;
  document.body.classList.remove('drilling');
  renderAll();
}

function getBranchData(dayObj,branch){
  for(var i=0;i<dayObj.branch.length;i++){
    if(dayObj.branch[i].branch===branch)return dayObj.branch[i];
  }
  return null;
}

function renderDrill(){
  if(!drillBranch)return;
  var d=REPORT.days[curIdx];
  var b=getBranchData(d,drillBranch);
  if(!b){closeDrill();return;}
  var zn=BZONE_MAP[drillBranch]||b.zone||'市区';
  var zoneCls={'市区':'city','近郊':'sub','远郊':'far'};

  // 标题
  document.getElementById('drillTitle').innerHTML=drillBranch+'<span class="zchip '+zoneCls[zn]+'">'+zn+'</span>';
  document.getElementById('drillMeta').textContent='截至 '+curMonth+'/'+d.day+' · 已过'+d.days_elapsed+'天';

  // 总体概览卡片（复用主视图卡片样式）
  renderDrillCards(b);

  // 所在战区排名
  renderDrillZoneRank(d,b,zn);

  // 趋势图
  renderDrillTrend();
}

function renderDrillCards(b){
  var html='';
  function miniCard(key,label){
    var m=metricMeta[key];
    var O=b[key];
    var r=O.rate;
    var valHtml='<div class="rate '+(key==='qianzhao'?(O.qz_ratio>=32?'up':(O.qz_ratio>=25?'warn':'down')):rateClass(r))+'">'+(key==='qianzhao'?fmt(O.qz_ratio,1)+'<span class="pct">%</span>':fmt(r,1)+'<span class="pct">%</span>')+'</div>';
    var grid='<div class="grid">'+
      '<div class="stat"><div class="k">当日新增</div><div class="v">'+fmtInt(O.daily)+'户</div></div>'+
      '<div class="stat"><div class="k">当月累计</div><div class="v">'+fmtInt(O.cum)+'户</div></div>'+
      '<div class="stat"><div class="k">当月日均</div><div class="v">'+fmt(O.avg,1)+'户/日</div></div>'+
      (key==='qianzhao'
        ?'<div class="stat"><div class="k">千兆占家宽</div><div class="v">'+fmt(b.jiakuan.avg?(O.avg/b.jiakuan.avg*100):0,1)+'%</div></div>'
        :'<div class="stat"><div class="k">月度牵引</div><div class="v">'+fmt(O.target,1)+'户/日</div></div>')+
      '</div>';
    html+='<div class="card '+key+'"><div class="top"><div class="name">'+label+'</div>'+valHtml+'</div>'+grid+'</div>';
  }
  miniCard('jiakuan','家宽');
  miniCard('fttr','FTTR');
  miniCard('zhiping','智屏');
  miniCard('qianzhao','千兆');
  document.getElementById('drillCards').innerHTML=html;
}

function renderDrillZoneRank(d,b,zn){
  var zb=d.branch.filter(function(x){return BZONE_MAP[x.branch]===zn});
  zb.sort(function(a,b){return(b.jiakuan.rate||0)-(a.jiakuan.rate||0)});
  var idx=-1;
  zb.forEach(function(x,i){if(x.branch===b.branch)idx=i});
  var html='';
  zb.forEach(function(x,i){
    var self=x.branch===b.branch;
    var r=x.jiakuan.rate||0;
    var barCls=r>=100?'up':(r>=80?'warn':'down');
    var w=Math.min(150,r);
    html+='<div class="drill-zone-row'+(self?' self':'')+'" data-branch="'+x.branch+'">'+
      '<div class="zr-rank">'+(i+1)+'</div>'+
      '<div class="zr-name">'+x.branch+(self?' <span style="color:var(--tel);font-size:11px">(本分公司)</span>':'')+'</div>'+
      '<div class="zr-rate"><div class="zr-bar"><div class="pf '+barCls+'" style="width:'+w+'%"></div></div>'+
      '<div class="zr-pill"><div class="val">'+fmt(r,1)+'%</div><div class="sub">日均 '+fmt(x.jiakuan.avg,1)+'</div></div></div>'+
      '</div>';
  });
  var meta='按家宽完成率排名 · 本战区共 '+zb.length+' 家 · 当前排名第 '+(idx>=0?(idx+1):'-')+' 位';
  document.getElementById('drillZoneMeta').textContent=meta;
  document.getElementById('drillZoneRank').innerHTML=html;
  // 点击战区行也可跳转
  document.getElementById('drillZoneRank').querySelectorAll('.drill-zone-row').forEach(function(row){
    row.onclick=function(){
      if(row.dataset.branch!==drillBranch)openDrill(row.dataset.branch);
    };
  });
}

function renderDrillTrend(){
  if(!drillBranch)return;
  var d=REPORT.days;
  var m=metricMeta[drillTab];
  var labels=d.map(function(x){return curMonth+'/'+x.day});
  var dailyArr=d.map(function(x){
    var b=getBranchData(x,drillBranch);
    if(!b)return 0;
    if(drillTab==='qianzhao')return b.qianzhao.daily||0;
    return b[drillTab].daily||0;
  });
  // 环比6月参考线（分公司维度）
  var JA=REPORT.meta.june_avg||{};
  var jB=(JA.branch||{})[drillBranch]||{};
  var juneVal=(drillTab==='qianzhao')?(jB.qianzhao_avg||0):(jB[drillTab+'_avg']||0);
  // 分公司牵引线：使用该分公司目标（千兆无目标则不画）
  var curB=getBranchData(d[d.length-1],drillBranch);
  var bTarget=(drillTab==='qianzhao')?null:(curB?curB[drillTab].target:0);
  var lineVal=bTarget;

  var tip='<strong style="color:'+metricMeta[drillTab].color+'">━━ '+drillBranch+' '+curMonth+'月当日新增</strong>'+
    (juneVal>0?' vs <strong style="color:#86909c">- - '+prevMonth+'日均 '+fmt(juneVal,1)+'</strong>':'')+
    (lineVal?'，<span style="color:#E60012">红色虚线为牵引值 '+fmt(lineVal,1)+'户/日</span>':'')+
    '，橙色点为周末';
  document.getElementById('drillTrendTip').innerHTML=tip;

  var ctx=document.getElementById('drillTrendChart').getContext('2d');
  if(drillChart)drillChart.destroy();
  drillChart=new Chart(ctx,{
    type:'line',
    data:{labels:labels,datasets:[
      {
        label:curMonth+'月 '+metricMeta[drillTab].name+'当日新增',
        data:dailyArr,
        borderColor:metricMeta[drillTab].color,
        backgroundColor:metricMeta[drillTab].color+'15',
        borderWidth:2.5,
        tension:0.3,
        pointRadius:function(ctx){
          if(ctx.dataIndex===curIdx)return 7;
          return isWeekend(d[ctx.dataIndex].date)?3:2;
        },
        pointBackgroundColor:function(ctx){
          if(ctx.dataIndex===curIdx)return '#E60012';
          return isWeekend(d[ctx.dataIndex].date)?'#FA8C16':metricMeta[drillTab].color;
        },
        pointBorderColor:'#fff',
        pointBorderWidth:1,
        fill:true,
        order:1
      },
      {
        label:prevMonth+'日均参考线',
        data:labels.map(function(){return juneVal||0}),
        borderColor:'#86909c',
        backgroundColor:'transparent',
        borderWidth:1.6,
        borderDash:[6,4],
        pointRadius:0,
        fill:false,
        order:2
      },
      {
        label:'牵引值(日均目标)',
        data:labels.map(function(){return lineVal||null}),
        borderColor:'#E60012',
        borderDash:[4,4],
        borderWidth:2,
        pointRadius:0,
        fill:false,
        order:3,
        spanGaps:false
      }
    ]},
    options:{
      responsive:true,
      maintainAspectRatio:false,
      interaction:{mode:'index',intersect:false},
      plugins:{
        legend:{labels:{font:{size:11},boxWidth:14,boxHeight:8,padding:8}},
        tooltip:{
          callbacks:{
            title:function(items){
              if(!items||!items.length)return '';
              var idx=items[0].dataIndex;
              var dayObj=d[idx];
              return curMonth+'/'+dayObj.day+'('+weekdayLabel(dayObj.date)+')'+(isWeekend(dayObj.date)?' ⏶ 周末':'');
            },
            label:function(ctx){
              var dIdx=ctx.dataIndex;
              var dayObj=d[dIdx];
              if(ctx.datasetIndex===0){
                if(drillTab==='qianzhao')return drillBranch+'千兆新增 '+fmtInt(ctx.parsed.y)+'户 | 日均 '+fmt(dayObj.qianzhao.avg,1);
                return drillBranch+' '+metricMeta[drillTab].name+'新增 '+fmtInt(ctx.parsed.y)+'户 | 日均 '+fmt(dayObj[drillTab].avg,1)+'户 | 完成率 '+fmt(dayObj[drillTab].rate,1)+'%';
              }
              if(ctx.datasetIndex===1)return prevMonth+'日均 '+fmt(ctx.parsed.y,1)+'户/日';
              return '牵引值 '+fmt(ctx.parsed.y,1)+'户/日';
            }
          }
        }
      },
      scales:{
        x:{grid:{display:false},ticks:{font:{size:9},maxRotation:0,autoSkip:false,color:function(ctx){
          var idx=ctx.index;
          if(idx>=0&&idx<d.length&&isWeekend(d[idx].date))return '#9c5b00';
          return '#4e5969';
        }}},
        y:{beginAtZero:true,grid:{color:'#f0f1f3'}}
      }
    }
  });
}

function renderAll(){
  renderCards();
  renderZones();
  renderTrend();
  renderRank();
  renderInsights();
}

// ===== Init =====
document.addEventListener('DOMContentLoaded',function(){
  REPORT = MULTI.months[curMonth];
  updateMetaTargets();
  document.getElementById('monthBadge').textContent = curMonth + '月';
  renderMonthSwitch();
  curIdx=REPORT.days.length-1;
  if(curIdx<0)curIdx=0;
  renderDays();
  selectDay(curIdx);
  document.querySelectorAll('.chart-tab').forEach(function(t){
    t.onclick=function(){
      document.querySelectorAll('.chart-tab').forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      curTab=t.dataset.key;
      renderTrend();
    };
  });
  document.getElementById('prevDay').onclick=function(){selectDay(curIdx-1)};
  document.getElementById('nextDay').onclick=function(){selectDay(curIdx+1)};
  // 下钻：返回按钮
  document.getElementById('drillBack').onclick=function(){closeDrill()};
  // 下钻：趋势图指标切换
  document.querySelectorAll('#drillChartTabs .chart-tab').forEach(function(t){
    t.onclick=function(){
      document.querySelectorAll('#drillChartTabs .chart-tab').forEach(function(x){x.classList.remove('active')});
      t.classList.add('active');
      drillTab=t.dataset.key;
      renderDrillTrend();
    };
  });
  document.addEventListener('keydown',function(e){
    if(e.key==='ArrowLeft')selectDay(curIdx-1);
    else if(e.key==='ArrowRight')selectDay(curIdx+1);
    else if(e.key==='Escape'&&drillBranch)closeDrill();
  });
  setTimeout(function(){var m=document.getElementById('mask');if(m)m.style.display='none'},300);
});
</script>
