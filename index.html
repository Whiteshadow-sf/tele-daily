<!DOCTYPE html>

<head>

<title>暑促社区业务展示台</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}

.container{max-width:600px;width:100%}

.card:hover{background:#fff;transform:translateY(-3px);border-color:#e60012;box-shadow:0 6px 20px rgba(230,0,18,0.12)}
.card-title{color:#1a1a1a;font-size:20px;font-weight:bold;margin-bottom:8px}
.card-desc{color:#666;font-size:14px;line-height:1.6}
.card-tag{display:inline-block;background:#e60012;color:#fff;font-size:12px;padding:3px 10px;border-radius:20px;margin-top:12px}
.footer{text-align:center;color:#999;font-size:12px;margin-top:30px}

</head>
<body>
<div class="container">

</a>
<a class="card" href="jiakuan.html">

</a>

</div>
